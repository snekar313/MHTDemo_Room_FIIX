name: Validate proposed IAB asset package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sources and asset-only CSV
        run: python tools/validate.py
      - name: Check hierarchy guardrails
        run: python -m unittest discover -s tools -p test_validate.py
      - name: Report validation boundary
        run: echo 'Offline checks only. Fiix import, full tenant collision coverage, Codex Cloud environment, and native IAB/PST validation are separate gates.'
